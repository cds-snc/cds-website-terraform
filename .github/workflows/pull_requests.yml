name: "Pull requests"

on:
  pull_request:
    paths:
      - "components/**"
      - "terragrunt/**"
      - ".github/workflows/**"

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ca-central-1
  TERRAFORM_VERSION: 1.6.1
  TERRAGRUNT_VERSION: 0.52.2
  TF_VAR_rds_cluster_password: ${{ secrets.RDS_CLUSTER_PASSWORD }}
  TF_VAR_asset_bucket_name: ${{ secrets.ASSET_BUCKET_NAME }}
  TF_VAR_strapi_admin_jwt_secret: ${{ secrets.STRAPI_ADMIN_JWT_SECRET }}
  TF_VAR_strapi_api_token_salt: ${{ secrets.STRAPI_API_TOKEN_SALT }}
  TF_VAR_github_token: ${{ secrets.TOKEN }}
  TF_INPUT: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write
  checks: write
  statuses: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup Terraform tools
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0

      - uses: dorny/paths-filter@7267a8516b6f92bdb098633497bad573efdbf271 # v2.12.0
        id: filter
        with:
          filters: |
            common:
              - '.github/workflows/pull_requests.yml'
              - 'terragrunt/terragrunt.hcl'
            website-cms:
              - 'components/website-cms/**'
              - 'terragrunt/website-cms/**'

      - name: configure aws credentials using OIDC
        uses: aws-actions/configure-aws-credentials@ffc08eae7350b1061d7de219e2135c75561fb680 # master
        with:
          role-to-assume: arn:aws:iam::773858180673:role/gh_plan_role
          role-session-name: TFPlan
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt plan website-cms
        if: steps.filter.outputs.website-cms == 'true' || steps.filter.outputs.common == 'true'
        uses: cds-snc/terraform-plan@39b0058bcf977fbd8b067b84d5a9f6165e356c32 # v3.7.0
        with:
          directory: "terragrunt/website-cms"
          comment-delete: "true"
          comment-title: "Website CMS"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          terragrunt: "true"
